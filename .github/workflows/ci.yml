name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Build & Test ───────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Build (all crates)
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  # ─── Release binaries ───────────────────────────────────────────────────────
  # Triggered on version tags (v*) and on pushes to main.
  # Also available from the GitHub UI via "Run workflow".
  release:
    name: Release — ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rmail-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: rmail-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rmail-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rmail-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin rmail --bin rmailctl

      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="$RELEASE_TAG"
            PRERELEASE="false"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            RELEASE_TAG="main-${SHORT_SHA}"
            RELEASE_NAME="Main build ${SHORT_SHA}"
            PRERELEASE="true"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Package binaries
        shell: bash
        run: |
          DIR="${{ matrix.artifact }}-${RELEASE_TAG}"
          mkdir -p "$DIR"
          cp target/${{ matrix.target }}/release/rmail    "$DIR/"
          cp target/${{ matrix.target }}/release/rmailctl "$DIR/"
          cp README.md HANDOFF.md config/rmail.toml.example "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
          echo "ARCHIVE=$DIR.tar.gz" >> $GITHUB_ENV

      - name: Create / update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.PRERELEASE }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
