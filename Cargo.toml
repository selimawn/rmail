[workspace]
resolver = "2"
members  = [
    "crates/core",
    "crates/config",
    "crates/queue",
    "crates/mailbox",
    "crates/smtp",
    "crates/imap",
    "crates/dns",
    "crates/tls",
    "crates/auth",
    "crates/server",
    "bin/rmail",
    "bin/rmailctl",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.82"
repository   = "https://github.com/selimawn/rmail"

[workspace.dependencies]
tokio              = { version = "1", features = ["full"] }
tokio-rustls       = "0.26"
rustls             = { version = "0.23", features = ["ring"] }
rustls-pemfile     = "2"
hickory-resolver   = { version = "0.24", features = ["tokio-runtime", "dns-over-rustls"] }
mail-parser        = "0.9"
mail-builder       = "0.3"
mail-auth          = "0.5"
nom                = "7"
serde              = { version = "1", features = ["derive"] }
toml               = "0.8"
clap               = { version = "4", features = ["derive"] }
argon2             = "0.5"
base64             = "0.22"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror          = "1"
anyhow             = "1"
time               = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
bytes              = "1"
bincode            = "1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
